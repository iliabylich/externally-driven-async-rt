[package]
name = "externally-driven-async-rt"
version = "0.3.0"
edition = "2024"
description = "Async runtime that is meant to be embedded"
license = "MIT"
repository = "https://github.com/iliabylich/externally-driven-async-rt"
authors = ["Ilya Bylich <ibylich@gmail.com>"]

[features]
strace-like = []

[dependencies]
rustix = { version = "1", default-features = false, features = [
    "event",
    "net",
] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
rustix = { version = "1", default-features = false, features = [
    "fs",
    "process",
    "std",
    "thread",
] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
# unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
# panic = "deny"
exit = "deny"
as_conversions = "deny"
redundant_pub_crate = "allow"
new_without_default = "allow"
future_not_send = "allow"
