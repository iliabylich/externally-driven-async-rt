[vars]
docker_image = "externally-driven-async-rt-linux"

[tasks.test]
run = "cargo test"

[tasks.miri]
run = "cargo +nightly miri test"

[tasks.coverage]
run = [
  "cargo llvm-cov clean --workspace",
  "cargo llvm-cov --no-report --remap-path-prefix",
  { task = "docker:run", args = [
    "cargo",
    "llvm-cov",
    "--no-report",
    "--remap-path-prefix",
    "--target",
    "aarch64-unknown-linux-gnu",
  ] },
  "cargo llvm-cov report --html --remap-path-prefix --target aarch64-unknown-linux-gnu --ignore-filename-regex '(^|/)(testing|tests)(/|\\.rs$)'",
  "open target/llvm-cov/html/index.html",
]

[tasks."docker:build"]
run = "docker build --quiet --tag {{vars.docker_image}} docker"

[tasks."docker:run"]
hide = true
raw = true
depends = ["docker:build"]
usage = 'arg "<args>" var=#true'
run = """
docker run --rm --ulimit nofile=256:256 $([ -t 0 ] && echo --interactive --tty) \
  --volume "$PWD:/work" \
  --volume externally-driven-async-rt-target:/work/target \
  --volume "$PWD/target/llvm-cov-target:/work/target/llvm-cov-target" \
  --volume externally-driven-async-rt-registry:/usr/local/cargo/registry \
  --workdir /work \
  {{vars.docker_image}} {{ usage.args | join(sep=" ") }}
"""

[tasks."docker:test"]
run = [{ task = "docker:run", args = ["cargo", "test"] }]

[tasks."docker:miri"]
run = [{ task = "docker:run", args = ["cargo", "+nightly", "miri", "test"] }]

[tasks."docker:shell"]
run = [{ task = "docker:run", args = ["bash"] }]
